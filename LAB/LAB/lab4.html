<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset align="center" >
            <legend><b>Hotel Room Booking Form</b></legend>
            <label for="">Full Name</label>
            <input type="text" id="name" username="">
            <br>
            <br>
            <label for="">Email  </label>
            <input type="text" id="email" username="">
            <br>
            <br>
            <label for="">Phone</label>
            <input type="number" id="phone" username="">
            <br>
            <br>
            <label for="">Check-in-Date</label>
            <input type="date" id="check-in-date" username="">
            <br>
            <br>
            <label for="">Check-out-Date</label>
            <input type="date" id="check-out-date" username="">
            <br>
            <br>
             <label for="">Room Type</label>
            <select>
                <option >Single Room</option>
                <option>Double Room</option>
            </select> 
            <br>
            <br>
            <label for="">Number of Guests</label>
            <input type="number" id="number of guests" username="">
            <br>
            <br>
            <label for="">Special Requests</label><br>
            <textarea id="special request"></textarea>
            <br>
            <br>
            
            <input type="submit" value="Book Now">
            <input type="reset"  value="Reset Form">



        </fieldset>
    </form>
    
</body>
</html>
