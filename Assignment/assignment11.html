<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Page</title>
</head>
<body>

    <!--  Skip Link: Allows keyboard users to jump directly to the main content -->
    <a href="#main-content">Skip to main content</a>

    <!-- Navigation Links -->
    <nav aria-label="Main Navigation">
        <a href="#home">Home</a>
        <a href="#help">Help</a>
    </nav>

    <!-- Main Content Landmark -->
    <main id="main-content">
        
        <!-- 3. Proper Heading: Uses <h1> to define the primary title of the page -->
        <h1>Accessible Page</h1>

        <div>
            <!-- 4. Alt Text: Provides a text description if the image fails to load -->
            <img src="banner.jpg" alt="" type="button" width="300" height="20">

            <!-- 5. ARIA Label: Explains the button's purpose when only an 'X' is visible -->
            <button type="button" aria-label="Close">X</button>
        </div>

        <br>

        <!-- Accessible Form Input: Connects the visible label to the input box -->
        <form>
            <label for="search-input">Search:</label>
            <input type="text" id="search-input" name="search" aria-label="Search the website">
        </form>

    </main>

</body>
</html>
