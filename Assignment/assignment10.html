<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Image section-->
    <h3>Image</h3>
    <!--'alt' displays fallback text if the images fails to load  -->
    <img src="campus.jpg" alt="College campus" width="200" height="200" >
<br>
    <!--Video section-->
    <h3>Video</h3>
    <!--controls adds plays, pause,and volume buttons to the video player -->
    <video width="250" height="150" controls>
        <source src="sample-video.mp4" type="video/mp4">
        Your Browser does not support the video tag.
    </video>
<br>
    <!--Audio Section-->
    <h3>Audio</h3>
    <!--controls displays the audio playback bar-->
    <audio controls>
        <source src="sample-audio.com" type="audio/mpeg">
        Your browser does not support the audio element.</audio>
<br>
        <!--YouTube Video Section-->
        <h3>YouTube</h3>
        <!--iframe embeds an external webpage or YouTube video player-->
        <iframe width="300" height="200"
        src="https://youtube.com"
        title="YouTube video player"
        frameborder="0"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>


    
</body>
</html>
