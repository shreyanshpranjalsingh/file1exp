<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body><!--<Blockquote> is used for long block quotations, which browser typically indent-->
    <blockquote>The best way to predict the future is to create it.</blockquote>
    <!--<p> is used for writing paragraph-->
    <p>As he said,"Stay hungry, stay foolish."</p>
    <!--<i> is used for italic-->
    <p>Book;<i>The Pragmatic Programmer</i></p>
    <p>W3C sets web standards.</p>
    <p><i>Contact:Admin Office</i></p>
    <p><i>College Road,Delhi</i></p>
    <!--<del> represents deletion and <ins>represent insertion-->
    <p><del>Old price 500</del><ins>New price 400</ins></p>
</body>
</html>
