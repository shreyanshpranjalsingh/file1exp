<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--1. Unordered List Section -->
    <h1>Unordered</h1>
    <!--<ul> creates a bulleted unordered list-->
    <ul>
        <!--<li> defines each list item-->
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
     </ul>
      <!--2. Ordered List Section -->
     <h1>Ordered</h1>
     <!--<ol> creates a numbered/lettered list-->
     <ol>
        <li>Install VS Code</li>
        <li>Create file</li>
        <li>Open in browser</li>
     </ol>
      <!--1. Description List Section -->
     <h1>Description</h1>
     <!--<dl> defines a description list-->
     <dl>
        <!--<dt> defines term/name-->
        <dt>HTML</dt>
        <!--<dd> defines the term above it-->
        <dd>HyperText Markup language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
     </dl>
</body>
</html>
