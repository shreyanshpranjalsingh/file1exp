<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 12: Table Sections</title>
</head>
<body>

    <!-- Create a table with a visible border -->
    <table border="1">
        
        <!-- Table Caption: Displays the title above the table -->
        <caption>Student Marks</caption>

        <!-- Table Header Section: Contains column headings -->
        <thead>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>

        <!-- Table Body Section: Contains the main data rows -->
        <tbody>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
        </tbody>

        <!-- Table Footer Section: Contains summary or calculated data -->
        <tfoot>
            <tr>
                <!-- Merge the first two columns using colspan="2" -->
                <td colspan="2">Average</td>
                <td>88.5</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
</body>
</html>
